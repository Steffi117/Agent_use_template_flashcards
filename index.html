<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grundstruktur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Patient anmelden</h1>
        <form id="name-form">
            <label for="patient-name">Name</label>
            <input type="text" id="patient-name" name="patientName" required>
            <button type="submit">Hinzufügen</button>
        </form>
        <section id="patient-list" aria-label="Angemeldete Patienten">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Uhrzeit</th>
                        <th>Trinkprotokoll</th>
                        <th>Arztgespräch</th>
                    </tr>
                </thead>
                <tbody id="patient-table-body"></tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
