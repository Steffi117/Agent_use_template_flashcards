<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabelkarten</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Vokabelkarten</h1>

    <form id="word-pair-form">
      <label for="english-word">Englisch</label>
      <input id="english-word" name="english" type="text" required>

      <label for="german-word">Deutsch</label>
      <input id="german-word" name="german" type="text" required>

      <button type="submit">OK</button>
    </form>

    <h2>Üben</h2>
    <div id="practice-card">
      <p id="english-practice-word">Keine Vokabeln vorhanden</p>
      <p id="german-practice-word"></p>
      <button id="reveal-button" type="button">Aufdecken</button>
    </div>

    <h2>Gespeicherte Vokabeln</h2>
    <ul id="word-pair-list"></ul>
  </main>
</body>
</html>
