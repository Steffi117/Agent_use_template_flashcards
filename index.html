<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leere Seite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="name-form">
    <label for="name-input">Name</label>
    <input type="text" id="name-input" name="name" required>
    <label for="units-input">Verordnete Einheitenanzahl</label>
    <input type="number" id="units-input" name="units" min="1" step="1" required>
    <button type="submit">Hinzufügen</button>
  </form>
  <div id="measure-area">
    <label for="measure-select">Durchgeführte Maßnahme</label>
    <select id="measure-select">
      <option value="">Bitte wählen</option>
      <option value="Knete">Knete</option>
      <option value="Papier">Papier</option>
      <option value="Jenga">Jenga</option>
      <option value="Knöpfe">Knöpfe</option>
      <option value="Stift">Stift</option>
      <option value="Fingerübungen">Fingerübungen</option>
    </select>
  </div>
  <table id="patient-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Verordnete Einheitenanzahl</th>
        <th>Knete</th>
        <th>Papier</th>
        <th>Jenga</th>
        <th>Knöpfe</th>
        <th>Stift</th>
        <th>Fingerübungen</th>
      </tr>
    </thead>
    <tbody id="patient-list"></tbody>
  </table>
  <script src="script.js"></script>
</body>
</html>
